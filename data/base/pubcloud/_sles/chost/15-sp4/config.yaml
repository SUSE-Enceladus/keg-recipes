config:
  files:
    base_pubcloud_sles_chost_image_id:
      - path: /etc/os-release
        append: True
        content: |
          VARIANT_ID="chost"
          VARIANT_VERSION="`date +'%Y%m%d'`"
    base_pubcloud_chost_hardening: Null
  scripts:
    base_pubcloud_chost_scripts_fips: Null
    base_pubcloud_chost_hardening: Null
  services:
    base_pubcloud_chost_hardening: Null
