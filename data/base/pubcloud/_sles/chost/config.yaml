config:
  files:
    base_pubcloud_sles_chost_image_id:
      - path: /etc/os-release
        append: True
        content: |
          IMAGE_ID="chost"
          IMAGE_VERSION="`date +'%Y%m%d'`"
    base_pubcloud_chost_hardening:
     - path: /etc/systemd/system/aidecheck.service
       content: |-
         [Unit]
         Description=Aide Check
         [Service]
         Type=simple
         ExecStart=/usr/bin/aide --check
         [Install]
         WantedBy=multi-user.target
     - path: /etc/systemd/system/aidecheck.timer
       content: |-
         [Unit]
         Description=Aide check every day at 5AM
         [Timer]
         OnCalendar=*-*-* 05:00:00
         Unit=aidecheck.service
         [Install]
         WantedBy=multi-user.target
  scripts:
    base_pubcloud_chost_scripts:
      - chost-strip-image
    base_pubcloud_chost_scripts_fips:
      - enable-fips-mode
    base_pubcloud_chost_hardening:
      - aide-init-db
  services:
    base_pubcloud_chost_services:
      - containerd
    base_pubcloud_chost_hardening:
      - aidecheck
      - aidecheck.timer
setup:
  scripts:
    base_pubcloud_chost_hardening:
      - pcs-hardening-workarounds
      - pcs-hardening-chost
