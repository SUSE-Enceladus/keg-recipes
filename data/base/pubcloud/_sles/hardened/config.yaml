config:
  files:
    base_pubcloud_sles_hardened_variant_id:
      - path: /etc/os-release
        append: True
        content: IMAGE_ID="sles-hardened"
    base_pubcloud_sles_hardening:
     - path: /etc/systemd/system/aidecheck.service
       content: |-
         [Unit]
         Description=Aide Check
         [Service]
         Type=simple
         ExecStart=/usr/bin/aide --check
         [Install]
         WantedBy=multi-user.target
     - path: /etc/systemd/system/aidecheck.timer
       content: |-
         [Unit]
         Description=Aide check every day at 5AM
         [Timer]
         OnCalendar=*-*-* 05:00:00
         Unit=aidecheck.service
         [Install]
         WantedBy=multi-user.target
  scripts:
    base_pubcloud_sles_hardening:
      - aide-init-db
  services:
    base_pubcloud_sles_hardening:
      - aidecheck
      - aidecheck.timer
setup:
  scripts:
    base_pubcloud_sles_hardened_config:
      - pcs-hardening-workarounds
      - pcs-hardening
